<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>JobOps Command Center</title>
<style>
:root{
  --bg:#f5f6f8; --card:#fff; --ink:#17181c; --ink2:#5c6270; --ink3:#959aa8;
  --line:#e4e7ec; --line2:#eef0f4;
  --accent:#4f46e5; --accent-soft:#eef2ff;
  --green:#067647;--green-bg:#ecfdf3; --orange:#b54708;--orange-bg:#fffaeb;
  --red:#b42318;--red-bg:#fef3f2; --violet:#5925dc;--violet-bg:#f4f3ff;
  --blue:#175cd3;--blue-bg:#eff8ff; --slate:#475467;--slate-bg:#f2f4f7;
  --ease:cubic-bezier(.23,1,.32,1);
  --shadow-card:0 1px 2px rgb(16 24 40/.04),0 1px 3px rgb(16 24 40/.06);
  --shadow-pop:0 12px 32px -8px rgb(16 24 40/.18),0 4px 8px -4px rgb(16 24 40/.08);
  font-size:15px;
}
*{box-sizing:border-box} html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Inter,Arial,sans-serif;line-height:1.45;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit}
a{color:var(--accent);text-decoration:none} a:hover{text-decoration:underline}

/* ---------- layout ---------- */
#app{display:grid;grid-template-columns:228px 1fr;min-height:100vh}
sidebar{background:#fff;border-right:1px solid var(--line);position:sticky;top:0;height:100vh;display:flex;flex-direction:column;padding:14px 10px;overflow-y:auto}
.logo{display:flex;align-items:center;gap:9px;padding:6px 10px 14px;font-weight:700;font-size:15.5px;letter-spacing:-.01em}
.logo .dot{width:9px;height:9px;border-radius:50%;background:var(--accent);box-shadow:0 0 0 4px var(--accent-soft)}
nav{display:flex;flex-direction:column;gap:2px;margin-top:4px}
nav a{display:flex;align-items:center;gap:9px;padding:7px 10px;border-radius:8px;color:var(--ink2);font-size:13.5px;font-weight:550;transition:background-color 140ms ease,color 140ms ease}
nav a:hover{background:var(--line2);color:var(--ink);text-decoration:none}
nav a.active{background:var(--accent-soft);color:var(--accent)}
nav a svg{width:15px;height:15px;flex:none;opacity:.75}
.side-foot{margin-top:auto;padding:10px;font-size:11px;color:var(--ink3)}

main{min-width:0;display:flex;flex-direction:column}
header.topbar{position:sticky;top:0;z-index:30;background:rgba(255,255,255,.88);backdrop-filter:blur(10px);border-bottom:1px solid var(--line);padding:9px 22px;display:flex;align-items:center;gap:12px}
.crumb{font-weight:650;font-size:15px;letter-spacing:-.01em}
.gsearch{position:relative;width:min(420px,38vw)}
.gsearch input{width:100%;border:1px solid var(--line);border-radius:9px;padding:7px 12px 7px 32px;font-size:13.5px;background:#fafbfc;transition:border-color 140ms ease, box-shadow 140ms ease}
.gsearch input:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px rgb(79 70 229/.12);background:#fff}
.gsearch .mag{position:absolute;left:10px;top:50%;transform:translateY(-50%);color:var(--ink3);width:14px;height:14px}
#gresults{position:absolute;top:calc(100% + 6px);left:0;right:0;background:#fff;border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow-pop);max-height:60vh;overflow:auto;display:none;z-index:50}
#gresults.open{display:block}
.ggroup{padding:7px 12px 3px;font-size:10.5px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--ink3)}
.gitem{display:block;padding:7px 12px;border-top:1px solid var(--line2);cursor:pointer}
.gitem:hover{background:var(--line2)} .gitem b{font-size:13.5px;font-weight:600;display:block} .gitem span{font-size:12px;color:var(--ink2)}
.spacer{flex:1}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;padding:4px 10px;border-radius:99px;background:var(--slate-bg);color:var(--slate)}
.pill .led{width:7px;height:7px;border-radius:50%;background:var(--ink3)}
.pill.ok .led{background:#12b76a}.pill.bad .led{background:#f04438}
.iconbtn{position:relative;border:1px solid var(--line);background:#fff;width:34px;height:34px;border-radius:9px;display:inline-flex;align-items:center;justify-content:center;cursor:pointer;transition:transform 160ms ease-out, background-color 140ms ease}
.iconbtn:hover{background:#fafbfc}.iconbtn:active{transform:scale(.94)}
.iconbtn .cnt{position:absolute;top:-5px;right:-5px;background:#d92d20;color:#fff;font-size:10px;font-weight:700;border-radius:99px;min-width:17px;height:17px;display:flex;align-items:center;justify-content:center;padding:0 4px}
.btn{border:1px solid var(--line);border-radius:8px;background:#fff;padding:6px 12px;font-size:13px;font-weight:560;cursor:pointer;transition:transform 160ms ease-out,background-color 140ms ease,border-color 140ms ease}
.btn:hover{background:#fafbfc}.btn:active{transform:scale(.97)} .btn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}.btn.primary:hover{background:#4338ca}
.btn.danger{color:var(--red)}.btn.danger:hover{background:var(--red-bg)}
.btn.approve{background:#d92d20;border-color:#d92d20;color:#fff}.btn.approve:hover{background:#b42318}
.btn.sm{padding:3px 9px;font-size:12px;border-radius:7px}
.btn:disabled{opacity:.45;cursor:not-allowed;transform:none}
.menu-wrap{position:relative}
.menu{position:absolute;right:0;top:calc(100% + 6px);background:#fff;border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow-pop);min-width:230px;padding:6px;display:none;z-index:50}
.menu.open{display:block}
.menu button{display:block;width:100%;text-align:left;background:none;border:none;padding:8px 10px;border-radius:8px;font-size:13px;cursor:pointer}
.menu button:hover{background:var(--line2)}

.content{padding:20px 22px 70px;max-width:1240px;width:100%;margin:0 auto}
.pagehead h1{font-size:19px;margin:0 0 3px;letter-spacing:-.02em}
.pagehead p{margin:0 0 18px;color:var(--ink2);font-size:13.5px}

/* ---------- cards / kpis ---------- */
.kpis{display:grid;grid-template-columns:repeat(auto-fill,minmax(168px,1fr));gap:10px;margin-bottom:20px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;box-shadow:var(--shadow-card)}
.kpi .v{font-size:23px;font-weight:700;letter-spacing:-.03em}
.kpi .l{font-size:11.5px;color:var(--ink2);font-weight:550;margin-top:1px}
.kpi.warn .v{color:var(--orange)} .kpi.good .v{color:var(--green)} .kpi.bad .v{color:var(--red)}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow-card);margin-bottom:16px;overflow:hidden}
.card>.hd{display:flex;align-items:center;gap:10px;padding:13px 16px;border-bottom:1px solid var(--line2);font-weight:650;font-size:14px}
.card>.bd{padding:14px 16px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.grid3{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:16px}
@media(max-width:980px){.grid2,.grid3{grid-template-columns:1fr}}

/* action required */
.action-panel{border-color:#fecfc9;background:linear-gradient(180deg,#fff, #fef6f5)}
.act-item{display:flex;gap:11px;padding:10px 4px;border-top:1px solid var(--line2);align-items:flex-start;cursor:pointer}
.act-item:first-child{border-top:none}
.pb{flex:none;font-size:10.5px;font-weight:800;letter-spacing:.04em;border-radius:6px;padding:2px 7px;margin-top:2px}
.pb.P0{background:var(--red);color:#fff}.pb.P1{background:#f79009;color:#fff}.pb.P2{background:var(--blue);color:#fff}.pb.P3{background:var(--slate-bg);color:var(--slate)}
.act-item b{font-size:13.5px;display:block}.act-item span{font-size:12.5px;color:var(--ink2)}
.empty{padding:34px;text-align:center;color:var(--ink3);font-size:13.5px}
.unavail{display:inline-block;font-size:11px;color:var(--ink3);border:1px dashed var(--line);border-radius:6px;padding:1px 7px}

/* avatars + rich rows */
.avatar{width:27px;height:27px;border-radius:8px;display:inline-flex;align-items:center;justify-content:center;font-size:12px;font-weight:750;color:#fff;flex:none;margin-top:1px}
.company-cell{display:flex;gap:9px;align-items:flex-start}
.company-cell .cname{font-weight:650}
.evid-snip{display:block;font-size:11.5px;color:var(--ink3);max-width:240px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.minichips{display:flex;gap:4px;flex-wrap:wrap;margin-top:6px}
.minichip{font-size:11px;background:var(--slate-bg);color:var(--slate);border-radius:6px;padding:2px 8px;font-weight:600}
.minichip.hot{background:var(--accent-soft);color:var(--accent)}
.scorebig{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;text-align:center}
.scorebig .sb{border:1px solid var(--line2);border-radius:10px;padding:10px 6px}
.scorebig .sb .n{font-size:21px;font-weight:750;letter-spacing:-.02em}
.scorebig .sb .t{font-size:10.5px;color:var(--ink3);text-transform:uppercase;letter-spacing:.06em;font-weight:700;margin-top:1px}
.whyline{font-size:12px;color:var(--ink2);background:var(--slate-bg);border-radius:8px;padding:7px 10px;margin-top:8px}
tr.rowclick td{transition:background-color 120ms ease}

/* status badges */
.bdg{display:inline-flex;align-items:center;font-size:11px;font-weight:650;letter-spacing:.02em;padding:2px 9px;border-radius:99px;white-space:nowrap}
.bdg.submitted,.bdg.sent,.bdg.replied{background:var(--green-bg);color:var(--green)}
.bdg.pending,.bdg.draft{background:var(--slate-bg);color:var(--slate)}
.bdg.in_progress,.bdg.ready{background:var(--blue-bg);color:var(--blue)}
.bdg.review_required,.bdg.followup_due,.bdg.overdue{background:var(--orange-bg);color:var(--orange)}
.bdg.failed,.bdg.skipped,.bdg.cancelled{background:var(--red-bg);color:var(--red)}
.bdg.upcoming,.bdg.today{background:var(--violet-bg);color:var(--violet)}
.bdg.neutral{background:var(--slate-bg);color:var(--slate)}

/* tables */
.tblwrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13px}
th{position:sticky;top:0;background:#fafbfc;text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--ink2);padding:9px 12px;border-bottom:1px solid var(--line);white-space:nowrap;z-index:2}
td{padding:9px 12px;border-bottom:1px solid var(--line2);vertical-align:top}
tr.rowclick{cursor:pointer;transition:background-color 120ms ease}
tr.rowclick:hover{background:#fafbff}
td .sub{display:block;font-size:11.5px;color:var(--ink3)}
.toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:12px 16px;border-bottom:1px solid var(--line2)}
.toolbar input[type=text],.toolbar select{border:1px solid var(--line);border-radius:8px;padding:6px 10px;font-size:13px}
.toolbar input:focus,.toolbar select:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px rgb(79 70 229/.12)}
.chips{display:flex;gap:4px;flex-wrap:wrap}
.fchip{border:1px solid transparent;background:transparent;color:var(--ink2);padding:4px 11px;border-radius:99px;font-size:12.5px;font-weight:550;cursor:pointer}
.fchip:hover{background:var(--line2)}
.fchip[aria-pressed=true]{background:var(--ink);color:#fff}

/* bars */
.hbar{display:grid;grid-template-columns:130px 1fr 52px;gap:10px;align-items:center;margin:7px 0;font-size:12.5px}
.hbar .track{height:9px;background:var(--line2);border-radius:99px;overflow:hidden}
.hbar .fill{height:100%;background:var(--accent);border-radius:99px;transition:width .6s var(--ease)}
.hbar .num{text-align:right;color:var(--ink2);font-variant-numeric:tabular-nums}
.funnel-step{margin:9px 0}.funnel-step .lbl{display:flex;justify-content:space-between;font-size:12.5px;margin-bottom:3px}

/* system status */
.sysgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
.sysitem{border:1px solid var(--line2);border-radius:9px;padding:9px 12px;font-size:12.5px}
.sysitem .k{color:var(--ink3);font-size:10.5px;text-transform:uppercase;letter-spacing:.06em;font-weight:700}
.sysitem .v{margin-top:2px;font-weight:600}

/* drawer */
.drawer-bg{position:fixed;inset:0;background:rgb(23 24 28/.4);z-index:60;opacity:0;pointer-events:none;transition:opacity 220ms ease}
.drawer-bg.open{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(520px,94vw);background:#fff;z-index:61;box-shadow:var(--shadow-pop);transform:translateX(102%);transition:transform 300ms var(--ease);display:flex;flex-direction:column}
.drawer.open{transform:none}
.drawer .dh{display:flex;align-items:center;gap:10px;padding:15px 18px;border-bottom:1px solid var(--line)}
.drawer .dh h3{margin:0;font-size:15.5px}
.drawer .db{overflow-y:auto;padding:16px 18px;flex:1}
.sect{margin-bottom:18px}
.sect h4{margin:0 0 7px;font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:var(--ink3)}
.kv{display:grid;grid-template-columns:118px 1fr;gap:5px 10px;font-size:13px}
.kv dt{color:var(--ink2)}.kv dd{margin:0;word-break:break-word}
.evid{background:#fbfcfd;border:1px solid var(--line2);border-radius:8px;padding:9px 11px;font-size:12.5px;white-space:pre-wrap}

/* modal */
dialog{border:none;padding:0;border-radius:14px;box-shadow:var(--shadow-pop);width:min(720px,calc(100vw - 32px));opacity:0;transform:scale(.96);transition:opacity 220ms var(--ease),transform 220ms var(--ease)}
dialog[open]{opacity:1;transform:none}
dialog::backdrop{background:rgb(23 24 28/.42)}
.mhead{display:flex;align-items:center;padding:15px 20px 0}.mhead h2{font-size:15.5px;margin:0}
.mbody{padding:8px 20px 20px;max-height:min(72vh,660px);overflow:auto}
pre.md{white-space:pre-wrap;word-break:break-word;background:#fbfcfd;border:1px solid var(--line2);border-radius:8px;padding:12px 14px;font-size:12.8px;line-height:1.55;margin:0}

/* toasts */
#toasts{position:fixed;right:16px;bottom:16px;z-index:80;display:flex;flex-direction:column;gap:8px}
.toast{background:var(--ink);color:#fff;font-size:13px;padding:10px 14px;border-radius:10px;box-shadow:var(--shadow-pop);max-width:400px;transition:transform 300ms var(--ease),opacity 260ms ease}
.toast.hide{opacity:0;transform:translateY(6px)}

.skel{background:linear-gradient(90deg,var(--line2) 25%,#e9ecf1 45%,var(--line2) 65%);background-size:200% 100%;animation:sk 1.2s infinite linear;border-radius:8px;height:60px;margin-bottom:10px}
@keyframes sk{0%{background-position:200% 0}100%{background-position:-200% 0}}
.errbox{background:var(--red-bg);border:1px solid #fecdca;color:var(--red);border-radius:10px;padding:14px 16px;font-size:13.5px;margin-bottom:14px}

@media (prefers-reduced-motion: reduce){*{transition-duration:.01ms!important;animation-duration:.01ms!important}}
@media (max-width:900px){
  #app{grid-template-columns:64px 1fr}
  sidebar .logo span,nav a .txt,.side-foot{display:none}
  nav a{justify-content:center;padding:10px}
}
.mobile-only{display:none}
@media (max-width:900px){.mobile-only{display:inline-flex}}
</style>
</head>
<body>
<div id="app">
  <sidebar>
    <div class="logo"><span class="dot"></span><span>JobOps&nbsp;Center</span></div>
    <nav id="nav"></nav>
    <div class="side-foot">read-only over engine files<br>outreach actions proxied<br>to the approved sender</div>
  </sidebar>
  <main>
    <header class="topbar">
      <span class="crumb" id="crumb">Overview</span>
      <span class="spacer"></span>
      <div class="gsearch">
        <svg class="mag" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
        <input id="gs" type="text" placeholder="Search companies, jobs, recruiters…" autocomplete="off">
        <div id="gresults"></div>
      </div>
      <span class="pill" id="sup-pill" title="Supervisor state"><span class="led"></span><span id="sup-txt">…</span></span>
      <div class="menu-wrap">
        <button class="iconbtn" id="qa-btn" title="Quick actions"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M13 2 3 14h7l-1 8 10-12h-7l1-8z"/></svg></button>
        <div class="menu" id="qa-menu"></div>
      </div>
      <div class="menu-wrap">
        <button class="iconbtn" id="bell-btn" title="Notifications"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.9 1.9 0 0 0 3.4 0"/></svg><span class="cnt" id="bell-cnt" style="display:none">0</span></button>
        <div class="menu" id="bell-menu" style="max-height:60vh;overflow:auto"></div>
      </div>
    </header>
    <div class="content" id="view"><div class="skel"></div><div class="skel"></div></div>
  </main>
</div>

<div class="drawer-bg" id="drawer-bg"></div>
<aside class="drawer" id="drawer">
  <div class="dh"><h3 id="drawer-title"></h3><span class="spacer"></span><button class="btn sm" onclick="closeDrawer()">Close</button></div>
  <div class="db" id="drawer-body"></div>
</aside>

<dialog id="dlg"><form method="dialog" style="display:contents"><div class="mhead"><h2 id="dlg-title"></h2><span class="spacer"></span><button value="x" class="btn sm">Close</button></div></form><div class="mbody" id="dlg-body"></div></dialog>
<div id="toasts"></div>

<script>
"use strict";
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const NA='<span class="unavail" title="Not produced by the existing system">unavailable</span>';
function api(path,opts){return fetch(path,opts?{headers:{"Content-Type":"application/json"},...opts}:undefined).then(async r=>{let d=null;try{d=await r.json()}catch(e){} return {ok:r.ok,status:r.status,data:d||{error:"http_"+r.status}}})}
function toast(m,ms=4500){const t=document.createElement("div");t.className="toast";t.textContent=m;$("#toasts").appendChild(t);setTimeout(()=>{t.classList.add("hide");setTimeout(()=>t.remove(),350)},ms)}
function fmtD(s){if(!s)return"—";const d=new Date(s);return isNaN(d)?String(s):d.toLocaleDateString(undefined,{day:"numeric",month:"short",year:"numeric"})}
function fmtDT(s){if(!s)return"—";const d=new Date(s);return isNaN(d)?String(s):d.toLocaleString(undefined,{day:"numeric",month:"short",hour:"2-digit",minute:"2-digit"})}
const bdg=s=>`<span class="bdg ${esc(String(s||"neutral"))}">${esc(String(s||"—").replace(/_/g," "))}</span>`;
function stagger(sel){
  document.querySelectorAll(sel).forEach((el,i)=>{
    if(el.dataset.animated)return; el.dataset.animated="1";
    el.style.opacity="0"; el.style.transform="translateY(8px)";
    el.style.transition="opacity .35s var(--ease), transform .35s var(--ease)";
    el.style.transitionDelay=Math.min(i*28,360)+"ms";
    requestAnimationFrame(()=>requestAnimationFrame(()=>{el.style.opacity="1";el.style.transform="none";
      setTimeout(()=>{el.style.transition="";el.style.transitionDelay="";},600+i*28)}));
  });
}
function avatar(name){const h=[...String(name||"?")].reduce((a,c)=>(a*31+c.charCodeAt(0))>>>0,7)%360;
  return `<span class="avatar" style="background:hsl(${h},52%,44%)">${esc(String(name||"?").trim()[0]?.toUpperCase()||"?")}</span>`}

/* ---------------- navigation registry ---------------- */
const NAV=[
 ["overview","Overview"],["applications","Applications"],["priority","Priority Jobs"],
 ["discovery","Job Discovery"],["outreach","Recruiter Outreach"],["gmail","Gmail"],
 ["interviews","Interviews"],["assessments","Assessments"],["followups","Follow-ups"],
 ["analytics","Analytics"],["resume","Resume Intelligence"],["companies","Companies"],
 ["health","Automation Health"]];
const TITLES=Object.fromEntries(NAV);

let OVERVIEW_CACHE=null;

function route(){
  let h=location.hash.replace(/^#/,"")||"overview";
  const [page,arg]=h.split("/");
  const known=NAV.some(n=>n[0]===page)||page==="application";
  renderNav(page==="application"?"applications":page);
  $("#crumb").textContent=TITLES[page]||(page==="application"?"Application":page);
  const v=$("#view");
  v.innerHTML=`<div class="skel"></div><div class="skel"></div>`;
  if(page==="application")return openApplication(arg,true);
  Promise.resolve((PAGES[page]||PAGES.overview)(v,arg))
    .then(()=>stagger(".card, .kpi"))
    .catch(e=>{v.innerHTML=`<div class="errbox">Failed to load: ${esc(e.message)}</div>`});
}
function renderNav(active){
  $("#nav").innerHTML=NAV.map(([k,l])=>{
    let ic={overview:"M3 12h7V3H3zM14 21h7v-9h-7zM14 8h7V3h-7zM3 21h7v-6H3z",
      applications:"M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01",
      priority:"m12 2 3 7h7l-5.5 4.5L18 21l-6-4-6 4 1.5-7.5L2 9h7z",
      discovery:"circle:11 11 8|arrow",gmail:"M4 4h16v16H4zM4 7l8 6 8-6",
      interviews:"M8 2v4M16 2v4M3 9h18M5 5h14a2 2 0 0 1 2 2v13H3V7a2 2 0 0 1 2-2z",
      assessments:"M9 11l3 3 8-8M21 12v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h11",

window.osuSend=async function(id){
  const pf=await api(`/api/outreach/preflight?id=${encodeURIComponent(id)}`);
  if(pf.status===503)return toast("Outreach server offline.");
  if(!pf.ok){toast(pf.data.error==="already_sent"?"Already sent — never re-sends.":"Preflight failed.");return}
  const p=pf.data,dup=p.duplicate||{};
  dlgOpen("Review before sending",`
   <dl class="kv"><dt>To</dt><dd><b>${esc(p.to)}</b></dd><dt>Subject</dt><dd>${esc(p.subject)}</dd></dl>
   <pre class="md" style="max-height:240px;overflow:auto">${esc(p.body)}</pre>
   <div style="border:1px solid var(--line);border-radius:8px;margin:12px 0;overflow:hidden">
     <div style="padding:8px 12px;font-size:12.5px;border-bottom:1px solid var(--line2)">${dup.blocked?`<b style="color:var(--red)">STOP</b> — ${esc(dup.reasons[0]?.detail||"duplicate")}${dup.reasons[0]?.previous_date?` on <b>${esc(fmtDT(dup.reasons[0].previous_date))}</b>`:""}`:`<b style="color:var(--green)">OK</b> — no previous outreach found`}</div>
     <div style="padding:8px 12px;font-size:12.5px;border-bottom:1px solid var(--line2)">${p.attachment?`Attachment: <code>${esc(p.attachment)}</code>`:"No resume file configured"}</div>
     ${(dup.warnings||[]).map(w=>`<div style="padding:8px 12px;font-size:12.5px">note — ${esc(w)}</div>`).join("")}
   </div>
   <div style="display:flex;gap:8px;justify-content:flex-end">
     <button class="btn" onclick="dlgClose()">Cancel</button>
     <button class="btn approve" id="osu-go" ${p.can_send&&(OSU_STATE.mailConfigured||OSU_STATE.dryrun)?"":"disabled"}>Approve — send this one email</button>
   </div>`);
  $("#osu-go").onclick=async()=>{
    const res=await api("/api/outreach/send",{method:"POST",body:JSON.stringify({id,confirm:true})});
    if(res.ok){dlgClose();toast(`Sent ✓ ${res.data.message_id||""}`,7000);pgOutreach($("#view"))}
    else if(res.status===429){toast(res.data.detail||"Pacing limit.",9000)}
    else if((res.data.duplicate||{}).blocked){dlgClose();toast("Blocked: duplicate ("+res.data.duplicate.reasons[0]?.previous_date+")",9000);pgOutreach($("#view"))}
    else toast("Send failed: "+(res.data.detail||res.data.error||""));
  };
};

  $("#cc-flts").onclick=e=>{const b=e.target.closest(".fchip");if(!b)return;
    CC_STATE.flt.has(b.dataset.f)?CC_STATE.flt.delete(b.dataset.f):CC_STATE.flt.add(b.dataset.f);
    b.setAttribute("aria-pressed",CC_STATE.flt.has(b.dataset.f));CC_STATE.page=1;draw()};
  $("#cc-prev").onclick=()=>{CC_STATE.page--;draw()};$("#cc-next").onclick=()=>{CC_STATE.page++;draw()};
  draw();
}

/* polling helper that stops when tab hidden or navigated away */
let _pollTimer=null;
function pollWhileVisible(stillThere,fn,ms,view){
  clearTimeout(_pollTimer);
  _pollTimer=setTimeout(async()=>{
    if(document.visibilityState!=="visible"||!stillThere())return;
    await fn(view||$("#view"));
  },ms);
}
