<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Job Sniper - Alerts</title>
<style>
  :root {
    --bg: #0f1117;
    --card: #1a1d27;
    --border: #2a2d3a;
    --text: #e1e4ed;
    --muted: #8b8fa3;
    --accent: #6c5ce7;
    --green: #00b894;
    --red: #e17055;
    --yellow: #fdcb6e;
    --blue: #74b9ff;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: 'Segoe UI', -apple-system, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
  }

  /* Header */
  .header {
    background: linear-gradient(135deg, #1a1d27 0%, #2d1f4e 100%);
    border-bottom: 1px solid var(--border);
    padding: 16px 24px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    position: sticky;
    top: 0;
    z-index: 100;
  }
  .header-left { display: flex; align-items: center; gap: 16px; }
  .header h1 { font-size: 20px; font-weight: 700; }
  .header h1 span { color: var(--accent); }
  .back-link {
    color: var(--muted);
    text-decoration: none;
    font-size: 13px;
    padding: 6px 12px;
    border: 1px solid var(--border);
    border-radius: 6px;
    transition: all 0.2s;
  }
  .back-link:hover { border-color: var(--accent); color: var(--text); }

  /* Controls */
  .controls {
    display: flex;
    gap: 10px;
    align-items: center;
    flex-wrap: wrap;
  }
  .filter-btn {
    background: var(--card);
    border: 1px solid var(--border);
    color: var(--muted);
    padding: 6px 14px;
    border-radius: 6px;
    cursor: pointer;
    font-size: 12px;
    font-weight: 500;
    transition: all 0.2s;
  }
  .filter-btn:hover { border-color: var(--accent); color: var(--text); }
  .filter-btn.active { background: var(--accent); color: white; border-color: var(--accent); }
  .mark-read-btn {
    background: var(--green);
    border: none;
    color: white;
    padding: 6px 14px;
    border-radius: 6px;
    cursor: pointer;
    font-size: 12px;
    font-weight: 600;
    transition: opacity 0.2s;
  }
  .mark-read-btn:hover { opacity: 0.85; }

  /* Stats Bar */
  .stats-bar {
    display: flex;
    gap: 24px;
    padding: 16px 24px;
    border-bottom: 1px solid var(--border);
    background: var(--card);
  }
  .stat { text-align: center; }
  .stat .num { font-size: 24px; font-weight: 700; color: var(--accent); }
  .stat .lbl { font-size: 11px; color: var(--muted); margin-top: 2px; }
  .stat.unread .num { color: var(--yellow); }

  /* Container */
  .container { max-width: 900px; margin: 0 auto; padding: 20px; }

  /* Alert Cards */
  .alerts-list { display: grid; gap: 10px; }
  .alert-card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 16px 18px;
    display: grid;
    grid-template-columns: 1fr auto;
    gap: 10px;
    align-items: start;
    transition: border-color 0.2s, opacity 0.2s;
  }
  .alert-card:hover { border-color: var(--accent); }
  .alert-card.read { opacity: 0.55; }

  /* Unread dot */
  .alert-card.unread { border-left: 3px solid var(--yellow); }

  .alert-title {
    font-size: 15px;
    font-weight: 600;
    color: var(--text);
    text-decoration: none;
    line-height: 1.3;
  }
  .alert-title:hover { color: var(--accent); }

  .alert-meta {
    display: flex;
    flex-wrap: wrap;
    gap: 14px;
    margin-top: 5px;
    font-size: 12px;
    color: var(--muted);
  }
  .alert-meta span { display: flex; align-items: center; gap: 4px; }

  .alert-right {
    text-align: right;
    display: flex;
    flex-direction: column;
    align-items: flex-end;
    gap: 6px;
  }

  /* Badges */
  .badge-new {
    background: var(--yellow);
    color: #1a1d27;
    font-size: 10px;
    padding: 2px 8px;
    border-radius: 10px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.5px;
  }
  .source-badge {
    display: inline-block;
    padding: 2px 8px;
    border-radius: 4px;
    font-size: 10px;
    font-weight: 600;
    text-transform: uppercase;
  }
  .source-google_jobs { background: #1a472a; color: #34d399; }
  .source-linkedin { background: #1a2744; color: #60a5fa; }
  .source-reddit { background: #3d1a1a; color: #f87171; }
  .source-other { background: #2a2d3a; color: var(--muted); }

  .alert-time {
    font-size: 11px;
    color: var(--green);
    font-weight: 500;
  }
  .alert-posted {
    font-size: 11px;
    color: var(--muted);
  }

  /* Empty State */
  .empty {
    text-align: center;
    padding: 80px 20px;
    color: var(--muted);
  }
  .empty .icon { font-size: 56px; margin-bottom: 16px; }
  .empty h3 { font-size: 18px; color: var(--text); margin-bottom: 8px; }
  .empty p { font-size: 14px; line-height: 1.6; }
  .empty code {
    background: var(--card);
    padding: 2px 8px;
    border-radius: 4px;
    font-size: 13px;
    border: 1px solid var(--border);
  }

  /* Loading */
  .loading {
    text-align: center;
    padding: 40px;
    color: var(--muted);
  }

  /* Footer */
  .footer {
    text-align: center;
    padding: 16px;
    color: var(--muted);
    font-size: 11px;
    border-top: 1px solid var(--border);
    margin-top: 24px;
  }
  .footer span { color: var(--green); }

  /* Responsive */
  @media (max-width: 600px) {
    .header { flex-direction: column; gap: 12px; }
    .controls { width: 100%; justify-content: center; }
    .stats-bar { justify-content: space-around; }
    .alert-card { grid-template-columns: 1fr; }
    .alert-right { align-items: flex-start; flex-direction: row; gap: 8px; }
  }
</style>
</head>
<body>

<div class="header">
  <div class="header-left">
    <h1><span>&#128276;</span> Job Alerts</h1>
    <a href="/" class="back-link">&larr; Dashboard</a>
  </div>
  <div class="controls">
    <button class="filter-btn active" data-filter="all">All</button>
    <button class="filter-btn" data-filter="unread">Unread</button>
    <button class="filter-btn" data-filter="google_jobs">Google</button>
    <button class="filter-btn" data-filter="linkedin">LinkedIn</button>
    <button class="filter-btn" data-filter="reddit">Reddit</button>
    <button class="mark-read-btn" onclick="markAllRead()">Mark All Read</button>
  </div>
</div>

<div class="stats-bar">
  <div class="stat">
    <div class="num" id="stat-total">-</div>
    <div class="lbl">Total Alerts</div>
  </div>
  <div class="stat unread">
    <div class="num" id="stat-unread">-</div>
    <div class="lbl">Unread</div>
  </div>
  <div class="stat">
    <div class="num" id="stat-google">-</div>
    <div class="lbl">Google</div>
  </div>
  <div class="stat">
    <div class="num" id="stat-linkedin">-</div>
    <div class="lbl">LinkedIn</div>
  </div>
  <div class="stat">
    <div class="num" id="stat-reddit">-</div>
    <div class="lbl">Reddit</div>
  </div>
</div>

<div class="container">
  <div class="alerts-list" id="alerts-list">
    <div class="loading">Loading alerts...</div>
  </div>
</div>

<div class="footer">
  Auto-refreshes every 10s &mdash; Alerts older than 24h are auto-pruned
  &mdash; Last scan: <span id="last-scan">-</span>
</div>

<script>
const API = '/api/alerts';
let allAlerts = [];
let currentFilter = 'all';

// Fetch alerts from API
async function fetchAlerts() {
  try {
    const resp = await fetch(API);
    const data = await resp.json();
    allAlerts = data.alerts || [];
    updateStats(data.stats || {});
    renderAlerts();
    document.getElementById('last-scan').textContent = new Date().toLocaleTimeString();
  } catch (e) {
    console.error('Failed to fetch alerts:', e);
    document.getElementById('alerts-list').innerHTML =
      '<div class="empty"><div class="icon">&#9888;</div><h3>Connection Error</h3>' +
      '<p>Cannot reach the server. Make sure <code>dashboard_server.py</code> is running.</p></div>';
  }
}

// Update stats display
function updateStats(stats) {
  document.getElementById('stat-total').textContent = stats.total || 0;
  document.getElementById('stat-unread').textContent = stats.unread || 0;

  const counts = { google_jobs: 0, linkedin: 0, reddit: 0 };
  allAlerts.forEach(a => {
    if (counts[a.source] !== undefined) counts[a.source]++;
  });
  document.getElementById('stat-google').textContent = counts.google_jobs;
  document.getElementById('stat-linkedin').textContent = counts.linkedin;
  document.getElementById('stat-reddit').textContent = counts.reddit;
}

// Filter alerts
function getFiltered() {
  if (currentFilter === 'all') return allAlerts;
  if (currentFilter === 'unread') return allAlerts.filter(a => !a.is_read);
  return allAlerts.filter(a => a.source === currentFilter);
}

// Relative time
function timeAgo(isoStr) {
  if (!isoStr) return '';
  const diff = (Date.now() - new Date(isoStr).getTime()) / 1000;
  if (diff < 60) return 'just now';
  if (diff < 3600) return Math.floor(diff / 60) + 'm ago';
  if (diff < 86400) return Math.floor(diff / 3600) + 'h ago';
  return Math.floor(diff / 86400) + 'd ago';
}

// Source label
function sourceLabel(src) {
  const map = {
    google_jobs: 'Google Jobs',
    linkedin: 'LinkedIn',
    reddit: 'Reddit',
    other: 'RSS'
  };
  return map[src] || src;
}

// Escape HTML
function esc(s) {
  const d = document.createElement('div');
  d.textContent = s;
  return d.innerHTML;
}

// Render alerts
function renderAlerts() {
  const list = document.getElementById('alerts-list');
  const filtered = getFiltered();

  if (filtered.length === 0) {
    list.innerHTML = '<div class="empty"><div class="icon">&#128270;</div>' +
      '<h3>No alerts found</h3>' +
      '<p>' + (currentFilter === 'all'
        ? 'No jobs have been detected yet.<br>Start the sniper with: <code>python job_sniper.py</code>'
        : 'No alerts match this filter.') + '</p></div>';
    return;
  }

  list.innerHTML = filtered.map(a => {
    const readClass = a.is_read ? 'read' : 'unread';
    const newBadge = a.is_read ? '' : '<span class="badge-new">New</span>';
    return `
      <div class="alert-card ${readClass}" data-id="${esc(a.alert_id)}">
        <div>
          <a href="${esc(a.job_url)}" target="_blank" class="alert-title"
             onclick="markRead('${esc(a.alert_id)}')">${esc(a.job_title)}</a>
          <div class="alert-meta">
            <span>&#127970; ${esc(a.company)}</span>
            <span>&#128205; ${esc(a.location)}</span>
          </div>
        </div>
        <div class="alert-right">
          ${newBadge}
          <span class="source-badge source-${esc(a.source)}">${sourceLabel(a.source)}</span>
          <span class="alert-time">${timeAgo(a.created_at)}</span>
          ${a.posted_time ? '<span class="alert-posted">Posted: ' + esc(a.posted_time) + '</span>' : ''}
        </div>
      </div>`;
  }).join('');
}

// Mark single alert as read
async function markRead(alertId) {
  try {
    await fetch('/api/alerts/read', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ alert_ids: [alertId] })
    });
    // Update local state
    const alert = allAlerts.find(a => a.alert_id === alertId);
    if (alert) alert.is_read = true;
    updateStats({ total: allAlerts.length, unread: allAlerts.filter(a => !a.is_read).length });
    renderAlerts();
  } catch (e) {
    console.error('Failed to mark read:', e);
  }
}

// Mark all as read
async function markAllRead() {
  const ids = allAlerts.filter(a => !a.is_read).map(a => a.alert_id);
  if (ids.length === 0) return;
  try {
    await fetch('/api/alerts/read', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ alert_ids: ids })
    });
    allAlerts.forEach(a => a.is_read = true);
    updateStats({ total: allAlerts.length, unread: 0 });
    renderAlerts();
  } catch (e) {
    console.error('Failed to mark all read:', e);
  }
}

// Filter button clicks
document.querySelectorAll('.filter-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    currentFilter = btn.dataset.filter;
    renderAlerts();
  });
});

// Initial load + auto-refresh
fetchAlerts();
setInterval(fetchAlerts, 10000);
</script>

</body>
</html>
